<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruitment Workplace Lab</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#18253b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:flex;min-height:100vh}.side{width:235px;background:#14233e;color:#dce6f6;padding:22px 12px;flex-shrink:0}.brand{font-weight:800;font-size:19px;padding:5px 12px 20px}.brand small{display:block;font-weight:400;font-size:11px;color:#a9bedc;margin-top:5px}.nav{display:block;width:100%;text-align:left;background:none;border:0;color:#c7d7ef;padding:12px;border-radius:9px;margin:3px 0}.nav.active,.nav:hover{background:#2b466f;color:white}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e0e5ee;padding:16px 25px;display:flex;justify-content:space-between;gap:10px;align-items:center}.top small{color:#64748b}.content{max-width:1160px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #dfe6f0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #18253b08}.metric{font-size:28px;font-weight:800;color:#1b396b}.muted{color:#66758a;font-size:13px}.pill{display:inline-block;background:#e8f0ff;color:#2453a0;padding:5px 9px;border-radius:30px;font-size:12px}.btn{border:0;background:#2357b8;color:white;border-radius:9px;padding:10px 14px}.btn.alt{background:#e9eef7;color:#243a59}.btn.danger{background:#a42d42}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:12px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:grid;gap:5px;font-size:13px;font-weight:600}input,select,textarea{border:1px solid #cdd7e5;border-radius:8px;padding:10px;width:100%;background:white;color:#17243b}textarea{min-height:76px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e7edf4;padding:11px 8px}th{color:#66758a}h1{margin:0 0 8px;font-size:25px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.tab{background:#e6edf8;color:#23436e;border:0;border-radius:9px;padding:10px}.tab.active{background:#2457b8;color:white}.note{background:#f1f6ff;border-left:4px solid #3e6dbd;padding:13px;border-radius:8px;font-size:13px;line-height:1.55}.success{background:#e9f8ed;border-left-color:#16803e}.warning{background:#fff5e4;border-left-color:#b97918}.flow{display:flex;gap:6px;flex-wrap:wrap}.step{background:#eaf0f8;padding:10px;border-radius:8px;font-size:12px}.hide{display:none}.small{font-size:12px}.listrow{border-bottom:1px solid #e8edf4;padding:12px 0}.linkbtn{border:0;background:none;color:#2357b8;text-decoration:underline;padding:4px}.toolcard{border:1px solid #dfe6ef;border-radius:11px;padding:15px;background:#fff}.toolcard strong{display:block;margin-bottom:7px}.toast{position:fixed;bottom:15px;right:15px;background:#1a385c;color:white;border-radius:10px;padding:12px 18px;display:none;z-index:9}.overflow{overflow:auto}@media(max-width:800px){.shell{display:block}.side{width:100%;padding:10px}.brand{padding:8px 10px}.menu{display:flex;overflow-x:auto;gap:4px}.nav{white-space:nowrap;width:auto;font-size:12px;padding:10px}.content{padding:14px}.top{padding:12px 15px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.fields{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">▣ Recruitment Workplace Lab<small>Enterprise-style practice • Fictional data</small></div><div class="menu" id="menu"></div></aside><main class="main"><div class="top"><div><b id="topname">Recruiter workspace</b><br><small>Practice environment • No real candidate data</small></div><button class="btn alt" onclick="exportData()">Export backup</button></div><div class="content" id="app"></div></main></div><div class="toast" id="toast"></div><script>
const key='recruitment-workplace-lab-v1';const seed={jobs:[{id:'REQ-101',title:'Recruitment Coordinator',dept:'Talent Acquisition',location:'Hyderabad',openings:2,status:'Approved',skills:'Scheduling, Outlook, Excel, ATS',owner:'Hiring Manager A'},{id:'REQ-102',title:'Java Developer',dept:'Engineering',location:'Hyderabad',openings:1,status:'Open',skills:'Java, Spring Boot, SQL',owner:'Hiring Manager B'}],candidates:[{id:1,name:'Ayesha Khan',email:'ayesha@example.test',role:'Recruitment Coordinator',skills:'Scheduling, Excel, Outlook',exp:3,stage:'Screening',notes:''},{id:2,name:'Rahul Sharma',email:'rahul@example.test',role:'Java Developer',skills:'Java, Spring Boot, SQL',exp:4,stage:'Applied',notes:''},{id:3,name:'Priya Reddy',email:'priya@example.test',role:'Recruitment Coordinator',skills:'ATS, Scheduling, Excel',exp:2,stage:'Interview',notes:''}],interviews:[],messages:[],offers:[],completed:[]};let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}const sections=['Dashboard','Requisitions','ATS Candidates','Sourcing Lab','Calendar','Inbox','Offers & Onboarding','Reports','Training Academy','Tool Guide'];let page='Dashboard';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch(e){toast('Browser storage unavailable; export a backup.')}};function toast(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}function go(p){page=p;render();window.scrollTo(0,0)}function render(){document.getElementById('menu').innerHTML=sections.map(s=>`<button class="nav ${s===page?'active':''}" onclick="go('${s}')">${s}</button>`).join('');document.getElementById('topname').textContent=page;document.getElementById('app').innerHTML=views[page]();}function formData(id){return Object.fromEntries(new FormData(document.getElementById(id)).entries())}function addJob(e){e.preventDefault();let x=formData('jobform');db.jobs.push({id:'REQ-'+(110+db.jobs.length),...x});save();render();toast('Requisition created')}function updateJob(id,v){db.jobs.find(x=>x.id===id).status=v;save();render()}function addCandidate(e){e.preventDefault();let x=formData('candidateform');db.candidates.push({...x,id:Date.now(),exp:Number(x.exp),stage:'Applied',notes:''});save();render();toast('Candidate added')}function updateCandidate(id,k,v){db.candidates.find(x=>x.id===id)[k]=v;save();toast('Candidate updated')}function addInterview(e){e.preventDefault();let x=formData('interviewform');if(db.interviews.some(i=>i.interviewer.trim().toLowerCase()===x.interviewer.trim().toLowerCase()&&i.date===x.date&&i.time===x.time)){toast('Conflict: interviewer already booked at this time');return}db.interviews.push({...x,id:Date.now()});save();render();toast('Mock interview scheduled')}function sendMessage(e){e.preventDefault();db.messages.unshift({...formData('mailform'),id:Date.now()});save();render();toast('Saved to simulated outbox — no email sent')}function addOffer(e){e.preventDefault();db.offers.push({...formData('offerform'),id:Date.now(),status:'Draft'});save();render();toast('Draft offer saved')}function updateOffer(id,v){db.offers.find(x=>x.id===id).status=v;save();render()}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='recruitment-practice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetData(){if(confirm('Reset all practice data? Export a backup first.')){db=JSON.parse(JSON.stringify(seed));save();render()}}
const views={
'Dashboard':()=>`<h1>Good afternoon, Recruiter</h1><p class="muted">Your simulated recruitment operations workspace. Complete real tasks with fictional information.</p><div class="grid">${[['Open requisitions',db.jobs.filter(x=>x.status!=='Closed').length],['Candidates',db.candidates.length],['Interviews',db.interviews.length],['Academy lessons',db.completed.length]].map(x=>`<div class="card"><div class="metric">${x[1]}</div><div class="muted">${x[0]}</div></div>`).join('')}</div><div class="two"><div class="card"><h2>Recruitment pipeline</h2><div class="flow">${['Applied','Screening','Interview','Offer','Hired'].map(s=>`<div class="step"><b>${db.candidates.filter(x=>x.stage===s).length}</b><br>${s}</div>`).join('')}</div><p class="muted">Update candidate stages in ATS Candidates to change these metrics.</p><button class="btn" onclick="go('ATS Candidates')">Open ATS</button></div><div class="card"><h2>Today's training plan</h2><p>1. Approve a requisition<br>2. Screen and move a candidate<br>3. Schedule an interview<br>4. Send a simulated update</p><button class="btn" onclick="go('Training Academy')">Start guided lessons</button></div></div><div class="note">This is an independent educational simulator inspired by common ATS and recruiter workflows. It does not connect to Workday, Greenhouse, iCIMS, Outlook, LinkedIn, or any real employer.</div>`,
'Requisitions':()=>`<h1>Workday Recruiting — Module 1</h1><div class="note"><b>Assignment:</b> Create a Recruitment Coordinator requisition for Hyderabad, 2 openings, requiring scheduling, Outlook, Excel and ATS experience. Set status to Pending Approval, then change it to Approved after your simulated hiring-manager review. This is a Workday-inspired learning exercise, not an official Workday screen.</div><p class="muted">Workday / SuccessFactors-style concepts: request → review → approval → open → close.</p><div class="card"><h2>Create requisition</h2><form id="jobform" onsubmit="addJob(event)" class="stack"><div class="fields"><label>Job title<input name="title" required placeholder="e.g. HR Operations Specialist"></label><label>Department<input name="dept" required></label><label>Location<input name="location" required value="Hyderabad"></label><label>Openings<input type="number" min="1" name="openings" value="1" required></label><label>Hiring manager<input name="owner" required></label><label>Status<select name="status">${opts(['Draft','Pending Approval','Approved','Open'])}</select></label></div><label>Required skills<textarea name="skills" required></textarea></label><button class="btn">Create requisition</button></form></div><div class="card overflow"><h2>Requisition queue</h2><table><tr><th>ID</th><th>Job</th><th>Location</th><th>Skills</th><th>Status</th></tr>${db.jobs.map(j=>`<tr><td>${esc(j.id)}</td><td><b>${esc(j.title)}</b><br><span class="muted">${esc(j.owner)}</span></td><td>${esc(j.location)}</td><td>${esc(j.skills)}</td><td><select aria-label="Status for ${esc(j.id)}" onchange="updateJob('${j.id}',this.value)">${opts(['Draft','Pending Approval','Approved','Open','Closed'],j.status)}</select></td></tr>`).join('')}</table></div>`,
'ATS Candidates':()=>`<h1>Applicant tracking system</h1><p class="muted">Greenhouse / iCIMS-style concepts: candidate records, stage transitions, notes and searches.</p><div class="card"><h2>Add candidate</h2><form id="candidateform" class="stack" onsubmit="addCandidate(event)"><div class="fields"><label>Full name<input name="name" required></label><label>Mock email<input type="email" name="email" required placeholder="person@example.test"></label><label>Applied role<input name="role" required></label><label>Years of experience<input type="number" min="0" max="50" name="exp" required></label></div><label>Skills (comma-separated)<input name="skills" required></label><button class="btn">Add candidate</button></form></div><div class="card"><div class="row"><h2>Candidate pipeline</h2><input style="max-width:280px" id="candidateSearch" placeholder="Search name, skills, role" oninput="filterCandidates()"></div><div class="overflow"><table><thead><tr><th>Candidate</th><th>Role / Skills</th><th>Stage</th><th>Recruiter notes</th></tr></thead><tbody id="candidateRows">${candidateRows()}</tbody></table></div></div>`,
'Sourcing Lab':()=>`<h1>Sourcing & Boolean search lab</h1><p class="muted">Practice searching a fictional talent pool. Supports AND, OR, and quoted phrases; not an actual LinkedIn search.</p><div class="card"><h2>Search exercise</h2><div class="note">Hiring manager needs a Java developer with Java AND Spring Boot. Try <b>Java AND "Spring Boot"</b>.</div><br><label>Boolean search<input id="boolean" placeholder='Java AND "Spring Boot"' oninput="runBoolean()"></label><div id="sourcingResults" class="stack" style="margin-top:12px"></div></div><div class="card"><h2>Boolean search cheat sheet</h2><p><b>AND</b> narrows results; <b>OR</b> broadens results; <b>"quotes"</b> search for a phrase. Real platforms may interpret operators differently.</p><p class="muted">Practice: (Java OR Python) AND SQL — basic grouping is supported in this lab.</p></div>`,
'Calendar':()=>`<h1>Interview scheduling</h1><p class="muted">Outlook / Google Calendar-style scheduling workflow with mock availability and conflict checks.</p><div class="card"><h2>Schedule mock interview</h2><form id="interviewform" class="stack" onsubmit="addInterview(event)"><div class="fields"><label>Candidate<select name="candidate">${db.candidates.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label><label>Interviewer<input name="interviewer" required placeholder="Hiring Manager A"></label><label>Date<input type="date" name="date" required></label><label>Time (24-hour, Hyderabad)<input type="time" name="time" required></label><label>Meeting type<select name="type">${opts(['Phone screen','Technical interview','Hiring manager','Final loop'])}</select></label><label>Platform<select name="platform">${opts(['Teams (simulation)','Zoom (simulation)','Phone'])}</select></label></div><button class="btn">Book mock interview</button></form></div><div class="card overflow"><h2>Interview calendar</h2><table><tr><th>Candidate</th><th>Interviewer</th><th>Date / Time (IST)</th><th>Meeting</th></tr>${db.interviews.map(x=>`<tr><td>${esc(x.candidate)}</td><td>${esc(x.interviewer)}</td><td>${esc(x.date)} ${esc(x.time)}</td><td>${esc(x.platform)}</td></tr>`).join('')}</table>${db.interviews.length?'':'<p class="muted">No interviews scheduled yet.</p>'}</div><div class="note warning">Conflict detection currently checks identical interviewer, date and start time. It does not yet check interview durations, real availability, or calendar integrations.</div>`,
'Inbox':()=>`<h1>Recruiter communications</h1><p class="muted">Practice candidate follow-ups, escalation notes and hiring-manager updates. Messages are saved only inside this simulator.</p><div class="card"><h2>Compose simulated message</h2><form id="mailform" class="stack" onsubmit="sendMessage(event)"><label>Recipient (fictional)<input name="to" required placeholder="hiringmanager@example.test"></label><label>Subject<input name="subject" required></label><label>Message<textarea name="body" required placeholder="Hello, I am following up regarding..."></textarea></label><button class="btn">Save to mock outbox</button></form></div><div class="card"><h2>Simulated outbox</h2>${db.messages.map(x=>`<div class="listrow"><b>${esc(x.subject)}</b><div class="muted">To: ${esc(x.to)}</div><p>${esc(x.body)}</p></div>`).join('')||'<p class="muted">No messages yet.</p>'}</div>`,
'Offers & Onboarding':()=>`<h1>Offers & onboarding</h1><p class="muted">Learn offer approval, candidate acceptance, and onboarding handoff.</p><div class="card"><h2>Create mock offer</h2><form id="offerform" class="stack" onsubmit="addOffer(event)"><div class="fields"><label>Candidate<select name="candidate">${db.candidates.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label><label>Job title<input name="role" required></label><label>Annual salary (INR)<input type="number" min="0" name="salary" required></label><label>Proposed joining date<input type="date" name="joining" required></label></div><button class="btn">Create draft offer</button></form></div><div class="card"><h2>Offer approvals</h2>${db.offers.map(o=>`<div class="listrow row"><div><b>${esc(o.candidate)}</b> — ${esc(o.role)}<div class="muted">₹${esc(o.salary)} • Joining ${esc(o.joining)}</div></div><select style="max-width:180px" onchange="updateOffer(${o.id},this.value)">${opts(['Draft','Pending Approval','Approved','Accepted','Declined','Onboarding'],o.status)}</select></div>`).join('')||'<p class="muted">No draft offers yet.</p>'}</div><div class="note">Practice checklist: confirm approvals → verify candidate acceptance → request authorized documents → initiate background verification → arrange joining and onboarding. Never use real personal documents in this training website.</div>`,
'Reports':()=>{let total=db.candidates.length,inter=db.candidates.filter(x=>['Interview','Offer','Hired'].includes(x.stage)).length,hired=db.candidates.filter(x=>x.stage==='Hired').length;return `<h1>Recruitment analytics</h1><p class="muted">Excel-style recruitment metrics generated from your simulated ATS data.</p><div class="grid">${[['Candidates',total],['Interview or later',inter],['Hired',hired],['Interview conversion',total?Math.round(inter/total*100)+'%':'0%']].map(x=>`<div class="card"><div class="metric">${x[1]}</div><div class="muted">${x[0]}</div></div>`).join('')}</div><div class="card"><h2>Stage distribution</h2>${['Applied','Screening','Interview','Offer','Hired','Rejected'].map(s=>`<div style="margin:10px 0"><div class="row small"><b>${s}</b><span>${db.candidates.filter(c=>c.stage===s).length}</span></div><div style="height:9px;background:#e7eef8;border-radius:6px;overflow:hidden"><div style="width:${total?db.candidates.filter(c=>c.stage===s).length/total*100:0}%;height:100%;background:#3564bd"></div></div></div>`).join('')}</div><div class="note">Time-to-fill and SLA metrics require reliable event timestamps and are planned for a later upgrade. The current conversion metric counts candidates in interview or later stages divided by all candidates.</div>`},
'Tool Guide':()=>`<h1>Tool-by-tool practice map</h1><p class="muted">Select a practice workspace below. These are educational simulations, not official product interfaces.</p><div class="grid">${[['Workday Recruiting','Requisitions','Requisition creation, approvals and job status'],['Greenhouse Recruiting','ATS Candidates','Candidate stages, recruiter notes and screening'],['iCIMS Talent Cloud','ATS Candidates','Applicant tracking and candidate searches'],['LinkedIn Recruiter','Sourcing Lab','Boolean search in a fictional talent pool'],['Microsoft Outlook / Google Calendar','Calendar','Mock scheduling and interviewer conflicts'],['Microsoft Outlook','Inbox','Candidate and hiring manager messages'],['SAP SuccessFactors Recruiting','Offers & Onboarding','Offer approvals and onboarding handoff'],['Microsoft Excel / Power BI','Reports','Recruitment metrics and funnel reporting']].map(x=>`<div class="card"><h2>${x[0]}</h2><p class="muted">${x[2]}</p><button class="btn" onclick="go('${x[1]}')">Practice ${x[0]}</button></div>`).join('')}</div><div class="note">Microsoft Teams, Zoom, Indeed Employer, DocuSign, and SharePoint are planned for later modules; they are not simulated in this version.</div>`,
'Training Academy':()=>`<h1>Recruitment training academy</h1><p class="muted">Learn → practice → check your decision. Lessons are based on fictional workplace situations.</p>${lessons.map((l,i)=>`<div class="card"><div class="row"><h2>${i+1}. ${l.title}</h2><span class="pill">${db.completed.includes(i)?'Completed':'Practice'}</span></div><p>${l.context}</p><div class="note">${l.question}</div><div class="stack" style="margin-top:12px">${l.answers.map((a,j)=>`<button class="btn alt" style="text-align:left" onclick="answerLesson(${i},${j})">${esc(a)}</button>`).join('')}</div><div id="lesson-${i}" style="margin-top:12px"></div></div>`).join('')}<div class="card"><h2>Data controls</h2><p class="muted">This static version stores practice progress in this browser only. Export regularly, especially before clearing Chrome data.</p><button class="btn alt" onclick="exportData()">Download JSON backup</button> <button class="btn danger" onclick="resetData()">Reset training data</button></div>`};
const lessons=[{title:'Requisition approval',context:'A hiring manager requests a new position. Budget approval is still pending.',question:'What should you do before treating the requisition as approved?',answers:['Open it immediately','Confirm the required approval workflow','Promise candidates an offer'],correct:1,why:'Confirm required approvals and documented authorization before opening the role.'},{title:'Candidate screening',context:'The role requires Java, Spring Boot, SQL and at least 3 years of experience.',question:'Which profile meets the listed minimum requirements?',answers:['4 years Java, Spring Boot, SQL','5 years Python and SQL','2 years Java, Spring Boot, SQL'],correct:0,why:'The first candidate meets all specified minimums. Also verify interest, availability and other legitimate requirements.'},{title:'Interview conflict',context:'An interviewer is booked at 3:00 PM for another interview.',question:'What is the best next step?',answers:['Send the invite anyway','Confirm alternative availability and coordinate a new slot','Cancel the candidate without explanation'],correct:1,why:'Avoid double-booking, verify calendars, and communicate an alternative promptly.'},{title:'Candidate privacy',context:'You are practicing with an unofficial ATS simulator.',question:'Which data should you use?',answers:['Real candidate CVs and ID proofs','Fictional profiles only','A coworker’s login credentials'],correct:1,why:'Use fictional data. Real candidate data belongs only in authorized, secure employer systems.'},{title:'Hiring manager update',context:'The hiring manager has not responded to interview availability requests.',question:'What is the most appropriate action?',answers:['Follow up with clear urgency and escalate according to SLA','Mark the interview complete','Ignore the request'],correct:0,why:'Follow established SLA and escalation rules, and keep stakeholders informed.'}];function answerLesson(i,j){let l=lessons[i],correct=j===l.correct;if(correct&&!db.completed.includes(i)){db.completed.push(i);save()}document.getElementById('lesson-'+i).innerHTML=`<div class="note ${correct?'success':'warning'}"><b>${correct?'Correct — lesson completed':'Try again'}</b><br>${l.why}</div>`}
function candidateRows(q=''){return db.candidates.filter(c=>(c.name+' '+c.role+' '+c.skills).toLowerCase().includes(q.toLowerCase())).map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.email)} · ${esc(c.exp)} yrs</span></td><td>${esc(c.role)}<br><span class="muted">${esc(c.skills)}</span></td><td><select aria-label="Stage for ${esc(c.name)}" onchange="updateCandidate(${c.id},'stage',this.value)">${opts(['Applied','Screening','Interview','Offer','Hired','Rejected'],c.stage)}</select></td><td><textarea aria-label="Notes for ${esc(c.name)}" onblur="updateCandidate(${c.id},'notes',this.value)">${esc(c.notes)}</textarea></td></tr>`).join('')||'<tr><td colspan="4">No matching candidates.</td></tr>'}function filterCandidates(){document.getElementById('candidateRows').innerHTML=candidateRows(document.getElementById('candidateSearch').value)}function runBoolean(){const q=document.getElementById('boolean').value.trim(),out=document.getElementById('sourcingResults');if(!q){out.innerHTML='';return}function test(expr,text){expr=expr.trim().replace(/^\((.*)\)$/,'$1');let or=expr.split(/\s+OR\s+/i);if(or.length>1)return or.some(s=>test(s,text));let and=expr.split(/\s+AND\s+/i);if(and.length>1)return and.every(s=>test(s,text));return text.toLowerCase().includes(expr.replace(/^"|"$/g,'').toLowerCase())}let results=db.candidates.filter(c=>test(q,c.skills+' '+c.role+' '+c.name));out.innerHTML=`<b>${results.length} matching fictional profiles</b>`+results.map(c=>`<div class="toolcard"><b>${esc(c.name)}</b><div class="muted">${esc(c.skills)} · ${esc(c.exp)} years</div></div>`).join('');}render();
</script></body></html>
